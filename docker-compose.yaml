services:
  # ------------------------------------------------------------------
  # Trading-Bot (Paper/Live) – QuickScalpStrategy
  # ------------------------------------------------------------------
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade
    restart: unless-stopped
    # Synology-DNS oft langsam → Telegram-Befehle hängen (Minuten statt Sekunden)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    volumes:
      # Relativ zum Compose-Projektverzeichnis (auf der NAS: ~/Projekte/freqtrade-ki-bot).
      - "./user_data:/freqtrade/user_data"
    environment:
      - TZ=Europe/Berlin
      - FREQTRADE__EXCHANGE__KEY=${EXCHANGE_KEY:-}
      - FREQTRADE__EXCHANGE__SECRET=${EXCHANGE_SECRET:-}
      - FREQTRADE__TELEGRAM__ENABLED=${TELEGRAM_ENABLED:-false}
      - FREQTRADE__TELEGRAM__TOKEN=${TELEGRAM_TOKEN:-}
      - FREQTRADE__TELEGRAM__CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FREQTRADE__API_SERVER__WS_TOKEN=${WS_TOKEN}
      - FREQTRADE__API_SERVER__USERNAME=${API_USERNAME}
      - FREQTRADE__API_SERVER__PASSWORD=${API_PASSWORD}
    # Kurz halten – sonst hängt Webhook-Recreate >5 Min (Exit 130)
    stop_grace_period: 20s
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy QuickScalpStrategy
    networks:
      - default
      - cloudflare

  # ------------------------------------------------------------------
  # Auto-Optimizer (parallel): Hybrid-Trigger + kleine Nudges
  # Schreibt NUR QuickScalpStrategy.json – nie config.json
  # ------------------------------------------------------------------
  optimizer:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-optimizer
    restart: unless-stopped
    depends_on:
      - freqtrade
    env_file:
      - .env
    volumes:
      # Relativ zum Compose-Projektverzeichnis (auf der NAS: ~/Projekte/freqtrade-ki-bot).
      - "./user_data:/freqtrade/user_data"
    environment:
      - TZ=Europe/Berlin
      - FREQTRADE_API_URL=http://freqtrade:8080
      - FREQTRADE_API_USER=${API_USERNAME}
      - FREQTRADE_API_PASS=${API_PASSWORD}
      - FREQTRADE_CONFIG=/freqtrade/user_data/config.json
      - STRATEGY_NAME=QuickScalpStrategy
      - TRADE_THRESHOLD=${OPTIMIZER_TRADE_THRESHOLD:-12}
      - POLL_INTERVAL_SECONDS=${OPTIMIZER_POLL_SECONDS:-300}
      - POLL_FAST_SECONDS=${OPTIMIZER_POLL_FAST_SECONDS:-120}
      - MIN_HOURS_BETWEEN_RUNS=${OPTIMIZER_MIN_HOURS:-4}
      - SETTLED_HOURS_BETWEEN_RUNS=${OPTIMIZER_SETTLED_HOURS:-12}
      - DISTRESS_MIN_HOURS=${OPTIMIZER_DISTRESS_MIN_HOURS:-1.0}
      - DISTRESS_TRADE_THRESHOLD=${OPTIMIZER_DISTRESS_TRADES:-6}
      - DISTRESS_WINRATE=${OPTIMIZER_DISTRESS_WINRATE:-0.40}
      - DISTRESS_AVG_PROFIT=${OPTIMIZER_DISTRESS_AVG_PROFIT:--0.003}
      - LOSE_STREAK_TRIGGER=${OPTIMIZER_LOSE_STREAK:-3}
      - STREAK_MIN_HOURS=${OPTIMIZER_STREAK_MIN_HOURS:-0.25}
      - STREAK_SKIP_HYPEROPT=${OPTIMIZER_STREAK_SKIP_HYPEROPT:-true}
      - GEMINI_ON_STREAK=${GEMINI_ON_STREAK:-true}
      - PLATEAU_KEEP_STREAK=${OPTIMIZER_PLATEAU_STREAK:-3}
      - LIVE_TRADE_LOOKBACK=${OPTIMIZER_LIVE_LOOKBACK:-50}
      - LOOKBACK_DAYS=${OPTIMIZER_LOOKBACK_DAYS:-45}
      - HOLDOUT_DAYS=${OPTIMIZER_HOLDOUT_DAYS:-7}
      - HYPEROPT_EPOCHS=${OPTIMIZER_HYPEROPT_EPOCHS:-80}
      - HYPEROPT_LOSS=${OPTIMIZER_HYPEROPT_LOSS:-SharpeHyperOptLoss}
      - HYPEROPT_JOBS=${OPTIMIZER_HYPEROPT_JOBS:-2}
      - MIN_HOLDOUT_TRADES=${OPTIMIZER_MIN_HOLDOUT_TRADES:-8}
      - IMPROVEMENT_THRESHOLD=${OPTIMIZER_IMPROVEMENT:-0.03}
      - MAX_DD_RATIO=${OPTIMIZER_MAX_DD_RATIO:-1.15}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_ADVISOR=${GEMINI_ADVISOR:-true}
      - LLM_API_URL=${LLM_API_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.0-flash}
      - OPTIMIZER_RUN_ON_START=${OPTIMIZER_RUN_ON_START:-false}
      - JOURNAL_ENABLED=${JOURNAL_ENABLED:-true}
      - JOURNAL_TELEGRAM_BATCH=${JOURNAL_TELEGRAM_BATCH:-5}
      - JOURNAL_LOOKBACK=${JOURNAL_LOOKBACK:-200}
      - JOURNAL_FILE=${JOURNAL_FILE:-/freqtrade/user_data/logs/trade_journal.md}
      - JOURNAL_JSONL=${JOURNAL_JSONL:-/freqtrade/user_data/logs/trade_journal.jsonl}
    # 30m Grace → Webhook-Timeout. Hyperopt ggf. hart beenden ist ok.
    stop_grace_period: 30s
    entrypoint: ["python"]
    command: ["/freqtrade/user_data/optimizer/optimizer.py"]
    networks:
      - default

networks:
  default:
    driver: bridge
  cloudflare:
    external: true
    name: cloudflare-tunnel-net
